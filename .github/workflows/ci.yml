name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing here needs write access to the repository.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant. These runs
# take about ten minutes each, so cancelling matters more than usual.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build contracts and run tests
    runs-on: ubuntu-latest
    # The suite compiles eleven contracts and runs 563 integration tests against
    # a real nodeos in Docker. Ten minutes is typical; the ceiling is here to
    # catch a hang rather than to bound normal work.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # The contracts include headers from contract-shared-headers/contracts-common,
          # which is a submodule. Without this the checkout omits it and every contract
          # that includes it fails to compile with "file not found".
          #
          # checkout rewrites the SSH URL in .gitmodules to token-authenticated HTTPS,
          # so this works as long as the submodule repository is readable by the token.
          # GITHUB_TOKEN is scoped to this repository alone, so a private submodule needs
          # either a deploy key or a token with access to it, supplied here.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          # Matches .tool-versions. Note .nvmrc says 18 and disagrees; these
          # should be reconciled, and until then this is the effective answer.
          node-version: '20.18.2'
          # No dependency cache here. It was first removed on the theory that it
          # caused the install failures below; it did not, they continued without
          # it. Left off regardless: it saves little against a ten minute run and
          # is one less thing between a red build and its cause.
          #
          # setup-node v5 and later turn caching on by default whenever
          # package.json has a packageManager field, which this one does. That
          # would quietly undo the decision above as a side effect of a version
          # bump, so it is declined explicitly. Reintroducing the cache is worth
          # doing, but as its own change that can be judged on its own result.
          package-manager-cache: false

      # --frozen-lockfile makes this job fail rather than silently resolve
      # something new when yarn.lock and package.json disagree. That is the
      # entire value of committing the lockfile: without it CI installs whatever
      # resolves today, and a dependency can drift under everyone at once.
      # --network-concurrency 1 works around a yarn v1 race where parallel
      # fetches corrupt its own cache, failing with ENOENT on .yarn-metadata.json
      # or .yarn-tarball.tgz for an arbitrary package - a different one each run,
      # which is what distinguishes it from a genuine problem with a dependency.
      # It costs some install time and buys a deterministic install.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-concurrency 1

      # Compiling eleven contracts costs about two and a half minutes, and most
      # pull requests do not touch a single line of C++. Restoring the artifacts
      # lets lamington skip straight to deploying them.
      #
      # The key is computed here rather than left to lamington's own .mod.json
      # staleness check, which ignores headers (Alien-Worlds/lamington#32) and so
      # would happily serve a stale binary when only a header changed. Hashing the
      # sources, the headers and .lamingtonrc ourselves means a header edit misses
      # the cache and the contracts are rebuilt, without relying on the part of
      # lamington that gets this wrong.
      #
      # .lamingtonrc is in the key because it carries the compiler flags, the cdt
      # version and the list of contracts to build: the same sources compiled
      # under a different cdt are not interchangeable. package.json is in it
      # because it pins lamington, which is what invokes the compiler - the
      # v1.4.0 to v1.5.3 upgrade changed how contracts are built, and artifacts
      # from either side of that should not be served to the other.
      #
      # The atomicassets fixture is a prebuilt binary committed inside this very
      # directory (see .gitignore). It is in the key because nothing else here
      # would notice it changing, and the restore would then write a stale copy
      # over the committed one.
      - name: Restore the compiled contracts
        uses: actions/cache@v6
        with:
          path: artifacts/compiled_contracts
          key: contracts-${{ hashFiles('contracts/**', 'external_contracts/**', 'contract-shared-headers/**', '.lamingtonrc', 'package.json', 'artifacts/compiled_contracts/IS_DEV/atomicassets/**') }}

      # Fails the job early and legibly if the toolchain cannot even load,
      # rather than surfacing as a confusing failure inside the first test. A
      # lamington release once shipped requiring mocha without declaring it,
      # which this catches in seconds.
      - name: Verify the test runner loads
        run: yarn lamington test --help > /dev/null

      # Two settings in .lamingtonrc are right for a developer at a terminal and
      # wrong for CI, and lamington has no flag to override either from the
      # command line (Alien-Worlds/lamington#38), so they are patched in place.
      #
      # bailOnFailure stops the suite at the first failure. Locally that saves you
      # a wait you were about to interrupt anyway. In CI the runner is already
      # paid for, and stopping early means a red build reports something like
      # "17 passing" out of 563 and tells you nothing about whether the rest still
      # pass - which is the first question anyone asks of a red build.
      #
      # The List reporter announces each test and then reports it, so it costs two
      # lines per test: about 1100 lines of a 1600 line log. Spec carries the same
      # names and durations on one line each, nested under their describes.
      - name: Report every failure, not just the first
        run: |
          jq '.bailOnFailure = false | .reporter = "Spec"' .lamingtonrc > .lamingtonrc.ci
          mv .lamingtonrc.ci .lamingtonrc
          git diff --stat .lamingtonrc

      # lamington pulls the prebuilt chain image when one has been published for
      # this eos/cdt/contracts combination and builds it otherwise, so there is
      # nothing to arrange here. Building costs several minutes but is correct.
      #
      # Contracts already restored from the cache are left alone; only what
      # changed is recompiled.
      - name: Build contracts and run the full suite
        run: yarn test

      # The log is the only way to diagnose a failure after the fact, and a
      # failed run is exactly when it is wanted.
      # Guards Alien-Worlds/lamington#69, which made this repository unbuildable on
      # Linux: eosio-cpp ran as root in the container, so the output directory and
      # the artifacts came back root-owned and lamington could not write its
      # .mod.json build stamp. Fixed in lamington v1.5.2. This repo carried a
      # pre-create workaround until that shipped.
      #
      # Kept as a standing assertion rather than deleted with the workaround: the
      # failure is invisible on macOS, because Docker Desktop maps ownership
      # through its VM, so CI is the only place a regression would ever show.
      - name: Assert the build artifacts belong to the build user
        # Runs even when the suite is red. This asserts a property of the build,
        # not of the tests, and a flaky test should not cost us the evidence.
        if: always()
        run: |
          strays=$(find artifacts/compiled_contracts -not -user "$(id -u)" -printf '%u %p\n' 2>/dev/null)
          if [ -n "$strays" ]; then
            echo "build artifacts are not owned by $(id -u), the user that ran the build:" >&2
            echo "$strays" | head -20 >&2
            echo "this is the lamington#69 regression; see the note above this step." >&2
            exit 1
          fi
          echo "all build artifacts owned by $(id -u)"

      - name: Upload the chain and test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: |
            .lamington/
          retention-days: 7
          if-no-files-found: ignore
